# One container per service. The Worker image is built once and started with different Worker__Roles
# (migrate | telegram | alerts | processing); the containers talk to each other only through PostgreSQL
# (raw messages + NOTIFY), so any of them can be restarted, scaled down or moved independently.
#
#   postgis ─┬─ migrate (one-shot: migrations + seed) ─┬─ collector-telegram ─┐
#            │                                          ├─ collector-alerts   ─┼─ raw_messages → processor × N
#            │                                          ├─ processor (replicas)             (NOTIFY wakes them)
#            │                                          ├─ api    (public map, read-only role)
#            │                                          ├─ admin  (settings, status, logs)
#            │                                          └─ analytics (source analytics: who copies whom; own schema)

name: puluj-g

x-worker: &worker
  image: puluj-g-worker
  build:
    context: ..
    dockerfile: deploy/Dockerfile.worker
  env_file: .env  # deploy/.env: compose reads it for ${…} substitution and passes it to the containers
  environment: &worker-env
    ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj;Password=${POSTGRES_PASSWORD:-puluj}"
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  volumes:
    - logs:/app/logs
  depends_on:
    postgis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: puluj
      POSTGRES_USER: puluj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puluj}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puluj -d puluj"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations (including the puluj_reader / puluj_admin roles) and the seed data, then exits.
  # Every other service waits for it, so a schema change is applied exactly once before anything starts.
  migrate:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: migrate
      Worker__Roles: migrate
      Serilog__WriteTo__1__Args__path: /app/logs/worker-migrate-.log
    depends_on:
      postgis:
        condition: service_healthy
    restart: "no"

  # Telegram MTProto collector: the only container that needs the session file and the my.telegram.org credentials.
  collector-telegram:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: collector-telegram
      Worker__Roles: telegram
      Serilog__WriteTo__1__Args__path: /app/logs/worker-collector-telegram-.log
    volumes:
      - tgsession:/app/session
      - logs:/app/logs

  # alerts.in.ua poller.
  collector-alerts:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: collector-alerts
      Worker__Roles: alerts
      Serilog__WriteTo__1__Args__path: /app/logs/worker-collector-alerts-.log

  # Parsing, correlation, track watchdog (and the LLM fallback). Scales horizontally: every replica claims messages
  # from raw_messages (status InProgress + claimed_by), so a message is processed exactly once; parsing runs in
  # parallel, the store stage is serialised by an advisory lock. Worker__AppendHostName gives each replica its own name
  # (heartbeat, claimed_by, `app` in the shared log file). Processing__Concurrency = workers per replica.
  # For a strictly ordered, reproducible rebuild run one replica with Processing__Concurrency=1.
  processor:
    <<: *worker
    deploy:
      replicas: 2
    environment:
      <<: *worker-env
      Worker__Name: processor
      Worker__AppendHostName: "true"
      Worker__Roles: processing
      Processing__Concurrency: "2"
      Serilog__WriteTo__1__Args__path: /app/logs/worker-processor-.log

  # Public map: read-only database role (created by the migrations; change the password with ALTER ROLE).
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj_reader;Password=${PULUJ_READER_PASSWORD:-puluj_reader}"
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8090:8080"
    volumes:
      - logs:/app/logs
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Admin panel: settings, status, statistics and logs of every service; read-write role, own port. Keep it off the
  # public internet (or set Admin__Token).
  #
  # Container management (panel → "Воркери"): the host's Docker socket is mounted, and the image carries the docker CLI
  # with the compose plugin, so the panel can restart / stop containers of this project and scale `processor`
  # (`docker compose up --scale`, run against the same compose files through the read-only /deploy mount). Security:
  # whoever controls the socket controls the host (root-equivalent) — the panel only ever touches containers labelled
  # with this compose project and refuses admin / postgis / migrate, but the socket itself has no such limit, so the
  # admin port must stay private (firewall / VPN) and Admin__Token set. Drop the socket line and Docker__Enabled to
  # run the panel without any of this.
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj_admin;Password=${PULUJ_ADMIN_PASSWORD:-puluj_admin}"
      ASPNETCORE_URLS: http://+:8081
      Admin__ApiUrl: http://api:8080
      Admin__Token: ${ADMIN_TOKEN:-ADMIN_TOKEN}
      Logs__Directory: /app/logs
      Docker__Enabled: "true"
      Docker__ComposeDir: /deploy
      Docker__Project: puluj-g
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8091:8081"
    volumes:
      - logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro  # compose files + .env (+ docker-compose.override.yml) for `docker compose ... --scale`
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Source analytics: indexes the message texts into the `analytics` schema (who copies whom, forwards, activity,
  # track firsts); the admin panel reads that schema. Owner role: it applies its own migrations. Port not published.
  analytics:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analytics
    env_file: .env
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj;Password=${POSTGRES_PASSWORD:-puluj}"
      ASPNETCORE_URLS: http://+:8082
      Analytics__Name: analytics
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - logs:/app/logs
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Puluj.Analytics.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  tgsession:
  logs:
