# One container per service. The Worker image is built once and started with different Worker__Roles
# (migrate | telegram | alerts | processing). Collectors write raw messages directly to PostgreSQL; one processor
# claims and processes those rows with bounded internal concurrency.
#
#   postgis ─┬─ migrate (one-shot: migrations + seed) ─┬─ collector-telegram ─┐
#            │                                          ├─ collector-alerts   ─┼─ PostgreSQL raw_messages → processor
#            │                                          ├─ processor
#            │                                          ├─ api    (public map, read-only role)
#            │                                          ├─ admin  (settings, status, logs)
#            │                                          └─ analytics (source analytics: who copies whom; own schema)

name: puluj-g

x-worker: &worker
  image: puluj-g-worker
  build:
    context: ..
    dockerfile: deploy/Dockerfile.worker
  env_file: .env  # deploy/.env: compose reads it for ${…} substitution and passes it to the containers
  environment: &worker-env
    ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj;Password=${POSTGRES_PASSWORD:-puluj}"
    EntityExtractor__Url: http://entity-extractor:8080
    EntityExtractor__Token: "${ENTITY_EXTRACTOR_TOKEN:-entity-extractor-local-only}"
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  volumes:
    - logs:/app/logs
  depends_on:
    postgis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgis:
    image: postgis/postgis:17-3.5
    # Tuned for the local 32 GiB Docker host during large history ingestion. Keep this configuration in Compose,
    # rather than altering the external pgdata volume, so deployments stay reproducible.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=500MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    # PostgreSQL dynamic shared-memory segments use /dev/shm. The Docker default (64 MiB)
    # is insufficient for concurrent workers and the 4 GiB shared buffer cache.
    shm_size: 4g
    environment:
      POSTGRES_DB: puluj
      POSTGRES_USER: puluj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puluj}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puluj -d puluj"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations (including the puluj_reader / puluj_admin roles) and the seed data, then exits.
  # Every other service waits for it, so a schema change is applied exactly once before anything starts.
  migrate:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: migrate
      Worker__Roles: migrate
      Serilog__WriteTo__1__Args__path: /app/logs/worker-migrate-.log
    depends_on:
      postgis:
        condition: service_healthy
    restart: "no"

  # Telegram MTProto collector: the only container that needs the session file and the my.telegram.org credentials.
  collector-telegram:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: collector-telegram
      Worker__Roles: telegram
      Serilog__WriteTo__1__Args__path: /app/logs/worker-collector-telegram-.log
    volumes:
      - tgsession:/app/session
      - logs:/app/logs

  # alerts.in.ua poller.
  collector-alerts:
    <<: *worker
    environment:
      <<: *worker-env
      Worker__Name: collector-alerts
      Worker__Roles: alerts
      Serilog__WriteTo__1__Args__path: /app/logs/worker-collector-alerts-.log

  # Parsing, correlation, track watchdog (and the LLM fallback). The single processor claims messages
  # from raw_messages (status InProgress + claimed_by), so a message is processed exactly once; parsing runs in
  # in parallel, while derived-state writes are serialised. Worker__AppendHostName gives the process a traceable name
  # (heartbeat, claimed_by, `app` in the shared log file). Processing__Concurrency controls its internal workers.
  # For a strictly ordered, reproducible rebuild set Processing__Concurrency=1.
  processor:
    <<: *worker
    # A fixed name makes `docker compose --scale processor=N` fail for N > 1.
    # The process also holds a PostgreSQL advisory lock, so a manually started
    # second container cannot become another database writer.
    container_name: puluj-g-processor
    environment:
      <<: *worker-env
      Worker__Name: processor
      Worker__AppendHostName: "true"
      Worker__Roles: processing
      Processing__Concurrency: "2"
      Serilog__WriteTo__1__Args__path: /app/logs/worker-processor-.log

  # The only new service: receives raw-message HTTP requests, runs configurable Python extractors and the existing
  # LLM fallback, then writes concrete entities to the registered ee_* tables. Delivery is hosted by the collector
  # workers, so entity writes and table locks never hold up raw-message ingestion.
  entity-extractor:
    build:
      context: ..
      dockerfile: entity-extractor/Dockerfile
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj_ee;Password=${PULUJ_EE_PASSWORD:-puluj_ee}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-ADMIN_TOKEN}
      ENTITY_EXTRACTOR_TOKEN: "${ENTITY_EXTRACTOR_TOKEN:-entity-extractor-local-only}"
      ENTITY_EXTRACTOR_CONCURRENCY: ${ENTITY_EXTRACTOR_CONCURRENCY:-4}
      Llm__Enabled: ${Llm__Enabled:-false}
      Llm__Model: ${Llm__Model:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Public map: read-only database role (created by the migrations; change the password with ALTER ROLE).
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.entity-api
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj_reader;Password=${PULUJ_READER_PASSWORD:-puluj_reader}"
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8090:8080"
    volumes:
      - logs:/app/logs
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Admin panel: settings, status, statistics and logs of every service; read-write role, own port. Keep it off the
  # public internet (or set Admin__Token).
  #
  # Container management (panel → "Воркери"): the host's Docker socket is mounted, and the image carries the docker CLI
  # with the compose plugin, so the panel can restart / stop containers of this project. Security:
  # whoever controls the socket controls the host (root-equivalent) — the panel only ever touches containers labelled
  # with this compose project and refuses admin / postgis / migrate, but the socket itself has no such limit, so the
  # admin port must stay private (firewall / VPN) and Admin__Token set. Drop the socket line and Docker__Enabled to
  # run the panel without any of this.
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.entity-admin
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj_admin;Password=${PULUJ_ADMIN_PASSWORD:-puluj_admin}"
      ASPNETCORE_URLS: http://+:8081
      Admin__ApiUrl: http://api:8080
      Admin__Token: ${ADMIN_TOKEN:-ADMIN_TOKEN}
      EntityExtractor__Url: http://entity-extractor:8080
      EntityExtractor__AdminToken: ${ADMIN_TOKEN:-ADMIN_TOKEN}
      Logs__Directory: /app/logs
      Docker__Enabled: "true"
      Docker__ComposeDir: /deploy
      Docker__Project: puluj-g
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8091:8081"
    volumes:
      - logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro  # compose files + .env (+ docker-compose.override.yml) for `docker compose ... --scale`
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Source analytics: indexes the message texts into the `analytics` schema (who copies whom, forwards, activity,
  # track firsts); the admin panel reads that schema. Owner role: it applies its own migrations. Port not published.
  analytics:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analytics
    env_file: .env
    environment:
      ConnectionStrings__Puluj: "Host=postgis;Port=5432;Database=puluj;Username=puluj;Password=${POSTGRES_PASSWORD:-puluj}"
      ASPNETCORE_URLS: http://+:8082
      Analytics__Name: analytics
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - logs:/app/logs
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Puluj.Analytics.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
    # Keep database storage outside Compose's lifecycle. `scripts/deploy.ps1` refuses to create it unless
    # -InitializeDatabase was explicitly supplied, preventing an accidental empty database on redeploy.
    name: ${PULUJ_PGDATA_VOLUME:-puluj-g-pgdata}
    external: true
  tgsession:
  logs:
