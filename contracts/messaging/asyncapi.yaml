    address: puluj.{lane}.ingress.received
    title: ingress.received
    description: kind=event; producer=collectors; replay_source=true
    parameters:
      lane:
        enum: [live, history, replay]
    messages:
      ingress_received:
        $ref: '#/components/messages/ingress_received'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: puluj.events
          type: topic
          durable: true
          autoDelete: false
  raw_stored:
