# AsyncAPI 3.0 registry шини Puluj (P01, ADR-0002). Генерується з topology.json (scripts у contracts/messaging/README.md);
# рукописні правки — лише через topology.json + повторну генерацію. Broker arguments (quorum, DLX, delivery-limit) — topology.json.queue_policies (P02).
asyncapi: 3.0.0
info:
  title: Puluj message platform
  version: '6.0.0'
  description: |
    Транспортні події та команди між collectors, воркерами й read-side (plan §3–6).
    Envelope — schemas/envelope.schema.json; payload кожного типу — schemas/events/*.schema.json.
    Status: accepted (ADR-0001/0002 accepted у P02); з P03 archive active (v2), з P04 raw-writer (v3), з P05 normalizer/parser (v4), з P06 finalizer/llm-worker (v5) active, решта — planned.
defaultContentType: application/json
servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: Один RabbitMQ контейнер для розробки (ADR-0001, dev profile закріплено P02: rabbitmq:4.3-management, Compose profile broker; HA — P16).
